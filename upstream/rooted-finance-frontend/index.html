    <!-- Theme initialization -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("rooted-theme");
          var theme = stored === "light" || stored === "dark" || stored === "system" ? stored : "dark";
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme;
          document.documentElement.classList.add(resolved);
          document.documentElement.style.colorScheme = resolved;
        } catch (e) {
          document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = "dark";
        }
      })();
    </script>

  <body>
    <script>
      // Redirect /verify?session=xxx to /#/verify?session=xxx for hash router
      (function () {
        var p = window.location.pathname;
        if (p === "/verify" || p.startsWith("/verify/")) {
          var hash = "#/verify" + window.location.search;
          window.location.replace(window.location.origin + "/" + hash);
        }
      })();
    </script>
    <div id="root"></div>
    <div id="splash">
      <img src="/rooted-banner.jpg" alt="Rooted Finance" />
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000000;
        opacity: 1;
        transition: opacity 0.5s ease-out;
      }
      #splash.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
    <script>
      window.__dismissSplash = function () {
        var splash = document.getElementById("splash");
        if (splash) {
          splash.classList.add("fade-out");
          setTimeout(function () { splash.remove(); }, 600);
        }
      };
      // Safety net: dismiss splash after 5 seconds even if JS bundle fails
      setTimeout(function () { window.__dismissSplash && window.__dismissSplash(); }, 5000);
      // Allow click/tap to dismiss splash immediately
      document.addEventListener("DOMContentLoaded", function () {
        var splash = document.getElementById("splash");
        if (splash) {
          splash.addEventListener("click", function () { window.__dismissSplash && window.__dismissSplash(); });
          splash.style.cursor = "pointer";
        }
      });
    </script>
